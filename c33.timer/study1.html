<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>timer</title>
</head>
<body>
    <script>
        let timer1 = setTimeout(function(){
            alert('gg');
        },1000); // 예약 기능임. 3초 뒤에 이 동작을 1번 하겠다.
        clearTimeout(timer1);
        let timer2 = setTimeout(function(){
            alert('asdf');
        },2000);
        clearTimeout(timer2);

        let count = 0;
        let timer3 = setInterval(function(){
            // console.log('test');
            count++;
        },1000);
        if(count===5){
            clearInterval(timer3);
        };
        let count2 = 5;
        function countdown(){
            count2--;
            console.log(count2);
            if(count2===0){
                return
            };
            setTimeout(function(){
                countdown();
            },1000);
        };
        countdown();
    </script>
</body>
</html>
