<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글씨크기조절</title>
    <link rel="stylesheet" href="./css/ex1.css">
    <script src="./js/ex1.js"></script>
</head>
<body>
    <div class="fontControl">
        <span id="btn-toggle"><img src="./img/menu.svg" alt="닫기"></span>
        <span id="btnFontUp">크게</span>
        <span id="btnFontDown">작게</span>
    </div>
    <div class="wrap">
        <h1>오늘의 추천</h1>
        <p>오늘은 조금 느긋하게 시간을 보내며, 좋아하는 것을 찾아보는 하루가 되면 좋겠어요.</p>
        <h2>카페에서의 작은 행복</h2>
        <p>따뜻한 커피 한 잔과 조용한 음악은 하루를 더 부드럽게 만들어 줍니다.</p>
        <p>창밖을 바라보며 생각을 정리하는 시간은 생각보다 큰 힘이 되어 줍니다.</p>
        <p>가볍게 산책을 하고, 좋아하는 노래를 듣는 것만으로도 일상이 조금 더 특별해집니다.</p>
        <p>작은 행복은 늘 가까이 있고, 우리가 조금만 주의를 기울이면 쉽게 찾을 수 있어요.</p>
    </div>
</body>
</html>
