<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>계산 도구</title>
</head>
<body>
    <script>
        console.log(Math.ceil(5.33)) //올림
        console.log(Math.floor(5.99)) //내림
        console.log(Math.round(5.5)) //반올림
        console.log(Math.pow(10,2)) //제곱
        console.log(Math.sqrt(100)) //제곱근
        console.log(Math.abs(-1)) //절댓값
        console.log(Math.max(1,2,3,5,6,7,1234,3215)) //제일 큰 수
        console.log(Math.min(1,2,3,5,6,7,1234,3215))
        console.log(Math.random())  //0~1 사이의 (0,1 미포함) 랜덤 수
        console.log(3.14159265359.toFixed(3)) //소수 n번째 자리까지
    </script>
</body>
</html>
