<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자바스크립트 기초</title>
</head>
<body>
    <script>
        // 자바스크립트 언어만 사용 가능한 영역
        console.log("ㅋㅋ")
        console.log("안"+"녕")
        console.log("웹디정선생"[1+2])
        console.log((100+20)/10)
        console.log(10%3)
        console.log(10**3)
        console.log("100"+10)
        console.log((100+"웹디정선생".length)*3)

        console.log(typeof("가나다"))
        console.log(typeof(100))
        console.log(Number('100')+2)
        // prompt("이름이 뭐에요")
        // confirm("진짜?")
        console.log(String(100))

        // document.write('<h1>'+prompt("이름이 뭐에요")+'님 반갑습니다.</h1>')
        document.write(`<h1>${prompt('이름 입력')}님 반갑습니다.</h1>`)
    </script>
    <h2>네 반갑습니다.</h2>
</body>
</html>
