<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>양식</title>
</head>
<body>
    <form action="#">
        <div>
            <label for="user-id">아이디</label>
            <input type="text" id="user-id" placeholder="아이디를 입력하세요">
        </div>
        <div>
            <label for="user-password">비밀번호</label>
            <input type="password" id="user-password" placeholder="비밀번호를 입력하세요">
        </div>
        <input type="submit" value="로그인">
    </form>
    <hr>
    <form action="#" enctype="multipart/form-data">
        <fieldset>
            <legend>계정 정보</legend>
            <div>
                <label for="userID">아이디</label>
                <input type="text" id="userID">
            </div>
            <div>
                <label for="userPW">비밀번호</label>
                <input type="password" id="userPW">
            </div>
            <div>
                <label for="userPW2">비밀번호 확인</label>
                <input type="password" id="userPW2" disabled>
            </div>
            <p>비밀번호는 영대문자와 영소문자 그리고 특수문자를 포함시켜주세요.</p>
        </fieldset>
        <form action="#" enctype="multipart/form-data">
        <fieldset>
            <legend>개인정보</legend>
            <div>
                <label for="userName">이름</label>
                <input type="text" id="userName" name="userName">
            </div>
            <div>
                <label for="userGender">성별</label>
                <input type="radio" id="man" name="userGender" checked>
                <label for="man">남자</label>
                <input type="radio" id="woman" name="userGender">
                <label for="woman">여자</label>
                <input type="radio" id="notsay" name="userGender">
                <label for="notsay">비공개</label>
            </div>
            <div>
                <label for="userBirth">생년월일</label>
                <input type="date" id="userBirth" name="userBirth">
            </div>
            <div>
                <label for="userService">전화번호</label>
                <select name="service" id="userService">
                    <option value="none">선택안함</option>
                    <option value="SKT" selected>SKT</option>
                    <option value="KT">KT</option>
                    <option value="LGU">LG U+</option>
                    <option value="alteul">알뜰폰</option>
                </select>
                <input type="number" name="phoneNumber">
                <a href="#">인증 요청</a>
            </div>
            <div>
                <label for="confirmNumber">인증번호</label>
                <input type="number" name="confirmNumber" id="confirmNumber">
            </div>
        </fieldset>
        <fieldset>
            <legend>기타 정보</legend>
            <div>
                <label for="userPhoto">프로필 사진</label>
                <input type="file" name="userPhoto" id="userPhoto">
            </div>
            <div>
                <label for="userProfileText">자기소개글</label>
                <textarea name="userProfileText" id="userProfileText" placeholder="자기소개글을 입력해주세요"></textarea>
            </div>
        </fieldset>
        <fieldset>
            <legend>개인정보처리방침</legend>
            <p>개인정보처리방침 전문</p>
            <div>
                <input type="checkbox" name="userAgree" id="userAgree">
                <label for="userAgree">개인정보처리방침에 동의합니다.</label>
            </div>
        </fieldset>
        <fieldset>
            <legend>제출</legend>
            <button type="submit">회원가입하기</button>
            <button type="reset">취소하기</button>
        </fieldset>
    </form>
</body>
</html>
