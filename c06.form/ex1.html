<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>예제</title>
</head>
<body>
    <h1>CREATE YOUR ACCOUNT</h1>
    <form action="#">
        <div>
            <label for="userEmail">Email Address</label>
            <input type="text" name="userEmail" id="userEmail">
        </div>
        <div>
            <label for="confirmEmail">Confirm your Address</label>
            <input type="text" name="confirmEmail" id="confirmEmail">
        </div>
        <div>
            <label for="userCountry">Country of Residence</label>
            <select name="userCountry" id="userCountry">
                <option value="AlandIslands">Aland Islands</option>
                <option value="Bahamas">Bahamas</option>
                <option value="China">China</option>
                <option value="Denmark">Denmark</option>
                <option value="Egypt">Egypt</option>
                <option value="France">France</option>
                <option value="UK">United Kingdom</option>
                <option value="Korea" selected>Korea, Republic of</option>
            </select>
        </div>
        <div>
            <input type="checkbox" name="policyAgree" id="policyAgree">
            <label for="policyAgree">I am 13 years of age or older and agree to the terms of the <i>Steam Subscriber Agreement</i> and the <i>Valve Privacy Policy.</i></label>
        </div>
        <button type="submit">Continue</button>
    </form>
</body>
</html>
