        // alert(sum2(3,4))

        // function abc(a){
        //     a()
        // }
        // abc(function(){alert('test')})
        // let a = function(){alert('test')}가 함수 안에서 실행된다
        // 일시적으로 a라는 함수를 만들고 실행을 하겠다는 것
        // abc 함수의 콜백함수가 a이다

        // 사물 -> 객체
        let fan = {
            body:'검은색',
            height:120,
            width:30,
            weight:'6kg',
            powerOn:function(){
                alert('선풍기 전원이 켜졌습니다')
                this.fanSpeed=1
                fan.showFanSpeed()
            },
            powerOff:function(){
                alert('선풍기 전원이 꺼졌습니다')
                this.fanSpeed=0
                fan.showFanSpeed()
            },
            fanSpeed:0,
            fanSpeedUp:function(){
                // 이 선풍기의 fanSpeed 올리는 기능
                this.fanSpeed+=1
                alert('선풍기 팬스피드를 올렸습니다')
                fan.showFanSpeed()
            },
            fanSpeedDown:function(){
                this.fanSpeed-=1
                alert('선풍기 팬스피드를 내렸습니다')
                fan.showFanSpeed()
            },
            showFanSpeed:function(){
                alert(`현재 선풍기의 풍속은 ${this.fanSpeed}단계입니다.`)
            }
        }
        // 함수 프로퍼티를 메서드라고 한다
        fan.body
        fan.weight
        fan.powerOn()
        fan.powerOff()
        fan.powerOn()
        fan.fanSpeedUp()
        // window.document.write() 이런 코드가 기본적으로 설정된 메서드를 불러온다는 뜻인 거다
        // window.alert() window는 브라우저. 기본적인 거라 생략된다.
    </script>
