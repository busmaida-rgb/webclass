<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>variable 변수</title>
</head>
<body>
    <script>
        10 // 상수
        '안녕' // 상수
        let a; // 변수(데이터가 저장되는 공간) 선언
        a = 10 // 오른쪽을 왼쪽에 저장한다
        console.log(a)
        a = '안녕'
        console.log(a)
        let b = 20 // 변수 선언과 초기와 같이
        console.log(b)
        b = '하세요'
        console.log(b)
        console.log(a+b)
        let c = a+b
        console.log(c)
        console.log(c[2]+c[4])
        var abc = 123; // 이제 이거쓰는건 권장안함
        const BIRTH = '625'; // 
    </script>
</body>
</html>
